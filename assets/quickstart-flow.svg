<svg viewBox="0 0 820 140" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C63FF"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="10" y="30" width="175" height="80" rx="14" fill="#F3F1FF" stroke="#6C63FF" stroke-width="2"/>
  <text x="97" y="60" text-anchor="middle" font-size="22">📥</text>
  <text x="97" y="85" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">1. Clone</text>
  <text x="97" y="101" text-anchor="middle" font-size="11" fill="#4b5563">clone the repo</text>

  <line x1="192" y1="70" x2="222" y2="70" stroke="#6C63FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="230" y="30" width="175" height="80" rx="14" fill="#F3F1FF" stroke="#6C63FF" stroke-width="2"/>
  <text x="317" y="60" text-anchor="middle" font-size="22">📋</text>
  <text x="317" y="85" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">2. Copy configs</text>
  <text x="317" y="101" text-anchor="middle" font-size="11" fill="#4b5563">into ~/.claude/</text>

  <line x1="412" y1="70" x2="442" y2="70" stroke="#6C63FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="450" y="30" width="175" height="80" rx="14" fill="#F3F1FF" stroke="#6C63FF" stroke-width="2"/>
  <text x="537" y="60" text-anchor="middle" font-size="22">🪄</text>
  <text x="537" y="85" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">3. Run /adopt</text>
  <text x="537" y="101" text-anchor="middle" font-size="11" fill="#4b5563">interviews + auto-applies</text>

  <line x1="632" y1="70" x2="662" y2="70" stroke="#6C63FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="670" y="30" width="150" height="80" rx="14" fill="#F3F1FF" stroke="#6C63FF" stroke-width="2"/>
  <text x="745" y="60" text-anchor="middle" font-size="22">✅</text>
  <text x="745" y="85" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="600">4. Verify</text>
  <text x="745" y="101" text-anchor="middle" font-size="11" fill="#4b5563">check /plan-pro fires</text>
</svg>
